{% set name = "azure-mgmt-extendedlocation" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 3b5c1d2f0a21f15e9b176f440206c702a1f77fa4b97df1ca4001f991abcf7cd1

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]


requirements:
  host:
    - setuptools
    - wheel
    - python
    - pip
  run:
    - python
    - isodate >=0.6.1
    - typing-extensions >=4.6.0
    - azure-common >=1.1
    - azure-mgmt-core >=1.3.2

# Azure sdk test tools are not supported by pypi and Anaconda.
# Only pip check is performed.
test:
  imports:
    - azure.mgmt.extendedlocation
    - azure.mgmt.extendedlocation.aio
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Extended Location Management Client Library for Python
  license: MIT
  license_file: LICENSE.txt
  license_family: MIT
  description: |
    This is the Microsoft Azure Extended Location Management Client Library.
  doc_url: https://github.com/Azure/azure-sdk-for-python
  dev_url: https://github.com/Azure/azure-sdk-for-python
  

extra:
  recipe-maintainers:
    - janjagusch
